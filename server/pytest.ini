[pytest]
# 单条用例卡死超过 90s，就打印所有线程的栈并以非零码退出。
#
# 为什么需要：WS 用例用 starlette TestClient 的 `receive_json()` 取消息，它没有
# 超时——只要期待的那条广播永远不来（协议改动、状态判断变了），用例就会**永久
# 阻塞**，整个套件挂死。曾因此白等 15 分钟只看到一句「Terminated」，连是哪条
# 用例卡住都不知道。装了 faulthandler 之后 90 秒就能拿到卡住那行的完整栈。
#
# 90s 足够宽松：最慢的用例是象棋 AI（0.9s 预算 × 若干手）与海战棋布阵，
# 实测全量套件 358 条跑完约 85 秒。
faulthandler_timeout = 90